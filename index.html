<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIFF Demo</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #f5f5f5;
  }
  #container {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
    box-sizing: border-box;
  }
  #message {
    font-size: 1.8rem;
    font-weight: 600;
    color: #333;
    word-break: break-word;
  }
</style>
</head>
<body>
  <div id="container">
    <div id="message">載入中...</div>
  </div>

  <script>
    const LIFF_ID = "2011409316-9PbF9G19";

    function setMessage(text) {
      document.getElementById("message").textContent = text;
    }

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        setMessage(`哈囉,${profile.displayName}`);
      } catch (error) {
        console.error("LIFF init/login error:", error);
        setMessage("初始化失敗,請稍後再試");
      }
    }

    main();
  </script>
</body>
</html>
